# Verify the archive and publish the website to GitHub Pages.
# Runs on every push to main, and on demand.
name: Verify and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.140.2"
  PAGEFIND_VERSION: "1.3.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify file checksums
        run: sha256sum -c SHA256SUMS --quiet

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Hugo and Pagefind (pinned, checksum-verified)
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          mkdir -p bin
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          curl -sSfL -o hugo.tar.gz "$base/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfL -o hugo_checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz\$" hugo_checksums.txt | awk '{print $1"  hugo.tar.gz"}' | sha256sum -c
          tar -xzf hugo.tar.gz -C bin hugo
          name=pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/CloudCannon/pagefind/releases/download/v${PAGEFIND_VERSION}
          curl -sSfL -o pagefind.tar.gz "$base/$name"
          curl -sSfL -o pagefind.sha256 "$base/$name.sha256"
          echo "$(awk '{print $1}' pagefind.sha256)  pagefind.tar.gz" | sha256sum -c
          tar -xzf pagefind.tar.gz -C bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build website
        run: tools/build_site.sh

      - name: Validate archive and website
        run: python -m pytest -q tests

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
