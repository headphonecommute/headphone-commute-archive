{{- /* A list of articles: date, title, categories. Context: a page collection. */ -}}
<ul class="listing">
{{- range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <div><a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- with .Params.category }}<span class="cats">{{ delimit . ", " }}</span>{{ end }}</div>
  </li>
{{- end }}
</ul>
